<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI Image Viewer</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="spinner"><div class="spinner-ring"></div></div>
<div id="app">
  <!-- Controls overlay (glass panel, auto-hides) -->
  <div id="controls" class="glass-panel">
    <div class="controls-top">
      <input type="text" id="search" placeholder="Search prompts..." class="glass-input">
      <select id="model-filter" class="glass-input">
        <option value="">All models</option>
      </select>
      <label class="toggle-label">
        <input type="checkbox" id="nsfw-toggle">
        <span>NSFW</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="fav-toggle">
        <span>Favorites</span>
      </label>
    </div>
    <div class="controls-bottom">
      <span id="image-count"></span>
      <button id="btn-rescan" class="rescan-btn" title="Re-scan collection">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="8" cy="4.5" rx="5" ry="1.2"/>
          <path d="M3 4.5v11c0 .7 2.2 1.2 5 1.2s5-.5 5-1.2V4.5"/>
          <path d="M3 10c0 .7 2.2 1.2 5 1.2s5-.5 5-1.2"/>
          <path d="M17 4v6"/>
          <polyline points="14 7 17 11 20 7"/>
          <path d="M21 20v-6"/>
          <polyline points="18 17 21 13 24 17"/>
        </svg>
      </button>
      <div class="view-modes">
        <button id="btn-wall" class="mode-btn active" title="Infinite wall">&#9858;</button>
        <button id="btn-grid" class="mode-btn" title="Grid">&#8862;</button>
        <button id="btn-fullscreen" class="mode-btn" title="Fullscreen (F)">&#9974;</button>
      </div>
    </div>
  </div>

  <!-- Main viewer area -->
  <div id="viewer">
    <div id="wall-container" class="wall-container"></div>
  </div>

  <!-- Fullscreen overlay -->
  <div id="fullscreen-overlay" class="fullscreen-overlay hidden">
    <div class="fullscreen-top glass-panel">
      <button id="fs-info" class="fs-icon-btn" title="Image details">&#9432;</button>
      <button id="fs-fav" class="fs-icon-btn" title="Favorite">&#9829;</button>
      <select id="fs-speed" class="ss-speed-select glass-input" title="Vitesse diaporama">
        <option value="2">2s</option>
        <option value="3">3s</option>
        <option value="5" selected>5s</option>
        <option value="10">10s</option>
        <option value="15">15s</option>
        <option value="30">30s</option>
      </select>
      <button id="fs-shuffle" class="fs-icon-btn" title="Mode al&#233;atoire">&#128256;</button>
      <button id="fs-slideshow" class="fs-icon-btn" title="Diaporama (Espace)">&#9654;</button>
      <button id="fs-close" class="fs-icon-btn" title="Close (Esc)">&times;</button>
    </div>
    <div id="fs-zoom-container">
      <img id="fs-image" class="fullscreen-image" src="" alt="">
    </div>
    <div id="filmstrip" class="filmstrip glass-panel">
      <div id="filmstrip-inner" class="filmstrip-inner"></div>
    </div>

    <!-- Slideshow kiosk controls -->
    <div id="kiosk-controls" class="kiosk-controls hidden">
      <button id="ss-pause" class="ss-pause-btn" title="Pause/Reprendre (Espace)">&#9208;</button>
      <div id="ss-progress" class="ss-progress-bar">
        <div id="ss-progress-fill" class="ss-progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- Details popup -->
  <div id="details-popup" class="details-popup hidden">
    <div class="details-card glass-panel">
      <button id="details-close" class="fs-icon-btn" title="Close">&times;</button>
      <div id="details-content"></div>
    </div>
  </div>
</div>

<script src="app.js?v=5"></script>
</body>
</html>
