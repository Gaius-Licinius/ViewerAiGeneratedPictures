<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI Image Viewer</title>
<link rel="icon" href="icons/icon.ico">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/base.css?v=3">
<link rel="stylesheet" href="css/controls.css?v=3">
<link rel="stylesheet" href="css/viewer.css?v=3">
<link rel="stylesheet" href="css/fullscreen.css?v=3">
<link rel="stylesheet" href="css/details.css?v=3">
<link rel="stylesheet" href="css/slideshow.css?v=3">
<link rel="stylesheet" href="css/mobile.css?v=3">
</head>
<body>
<div id="spinner"><div class="spinner-ring"></div></div>
<div id="app">
  <!-- Controls overlay (glass panel, auto-hides) -->
  <div id="controls" class="glass-panel">
    <div class="controls-top">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg>
        <input type="text" id="search" placeholder="Search prompts..." class="glass-input">
      </div>
      <select id="model-filter" class="glass-input">
        <option value="">All models</option>
      </select>
      <label class="switch">
        <input type="checkbox" id="nsfw-toggle">
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span class="switch-label">NSFW</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="fav-toggle">
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span class="switch-label">Favorites</span>
      </label>
    </div>
    <div class="controls-bottom">
      <span id="image-count" class="count-pill"></span>
      <button id="btn-rescan" class="icon-btn rescan-btn" title="Re-scan collection"><img src="icons/database-up.svg" width="18" height="18" alt=""></button>
      <div class="view-modes" data-mode="wall">
        <button id="btn-wall" class="mode-btn active" title="Infinite wall"><img src="icons/shuffle.svg" width="18" height="18" alt=""></button>
        <button id="btn-grid" class="mode-btn" title="Grid"><img src="icons/grid-3x3.svg" width="18" height="18" alt=""></button>
      </div>
      <button id="btn-fullscreen" class="icon-btn" title="Fullscreen (F)"><img src="icons/fullscreen.svg" width="18" height="18" alt=""></button>
    </div>
  </div>

  <!-- Main viewer area -->
  <div id="viewer">
    <div id="wall-container" class="wall-container"></div>
  </div>

  <!-- Fullscreen overlay -->
  <div id="fullscreen-overlay" class="fullscreen-overlay hidden">
    <div class="fullscreen-top glass-panel">
      <button id="fs-info" class="fs-icon-btn" title="Image details">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/><path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/></svg>
      </button>
      <button id="fs-fav" class="fs-icon-btn" title="Favorite">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path class="heart-outline" d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143q.09.083.176.171a3 3 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15"/>
          <path class="heart-fill" fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314"/>
        </svg>
      </button>
      <select id="fs-speed" class="ss-speed-select glass-input" title="Vitesse diaporama">
        <option value="2">2s</option>
        <option value="3">3s</option>
        <option value="5" selected>5s</option>
        <option value="10">10s</option>
        <option value="15">15s</option>
        <option value="30">30s</option>
      </select>
      <button id="fs-shuffle" class="fs-icon-btn" title="Mode al&#233;atoire"><img src="icons/shuffle.svg" width="20" height="20" alt=""></button>
      <button id="fs-slideshow" class="fs-icon-btn" title="Diaporama (Espace)"><img src="icons/play.svg" width="18" height="18" alt="Play"></button>
      <button id="fs-close" class="fs-icon-btn" title="Close (Esc)">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/></svg>
      </button>
    </div>
    <div id="fs-zoom-container">
      <img id="fs-image" class="fullscreen-image" src="" alt="">
    </div>
    <div id="filmstrip" class="filmstrip glass-panel">
      <div id="filmstrip-inner" class="filmstrip-inner"></div>
    </div>

    <!-- Slideshow kiosk controls -->
    <div id="kiosk-controls" class="kiosk-controls hidden">
      <button id="ss-pause" class="ss-pause-btn" title="Pause/Reprendre (Espace)"><img src="icons/pause.svg" width="24" height="24" alt="Pause"></button>
      <div id="ss-progress" class="ss-progress-bar">
        <div id="ss-progress-fill" class="ss-progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- Details popup -->
  <div id="details-popup" class="details-popup hidden">
    <div class="details-card glass-panel">
      <div class="details-header">
        <h2 class="details-title">Image Details</h2>
        <button id="details-close" class="fs-icon-btn" title="Close">
          <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/></svg>
        </button>
      </div>
      <div id="details-content"></div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
